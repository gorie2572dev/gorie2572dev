<svg xmlns="http://www.w3.org/2000/svg" width="960" height="792" viewBox="0 0 960 792" role="img" aria-labelledby="title"><title id="title">Selected CV projects: YodyEcom, Santa Pocket, and SantaFood. Role: Mobile Developer.</title><defs><linearGradient id="pastel" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f4b400"/><stop offset="62%" stop-color="#ffd23f"/><stop offset="100%" stop-color="#a78bdf"/></linearGradient><linearGradient id="wash" x2="100%" y2="80%"><stop stop-color="#fff4bf"/><stop offset=".5" stop-color="#ffe69a"/><stop offset="1" stop-color="#eee2ff"/></linearGradient></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="958" height="790" rx="28" fill="#fff9dd" stroke="#ebd58b"/><text x="36" y="42" font-size="12" fill="#7750a5" font-weight="700">03 / SELECTED PROJECTS</text><text x="36" y="82" font-size="30" fill="#302344" font-weight="700">A few products I have helped build.</text><rect x="28" y="108" width="904" height="202" rx="20" fill="#ffffff" stroke="#ebd58b"/><rect x="28" y="108" width="10" height="202" rx="5" fill="url(#pastel)" stroke="none"/><text x="52" y="139" font-size="11" fill="#7750a5" font-weight="700">E-COMMERCE · TEAM OF 10</text><text x="52" y="174" font-size="28" fill="#302344" font-weight="700">YodyEcom</text><text x="879" y="166" font-size="36" fill="#e8cc68" font-weight="700">01</text><text x="52" y="204" font-size="17" fill="#62556f" font-weight="400">Contributed to a monorepo foundation with Clean Architecture,</text><text x="52" y="227" font-size="17" fill="#62556f" font-weight="400">Riverpod, and a shared design system. Helped build tooling</text><text x="52" y="250" font-size="17" fill="#62556f" font-weight="400">to automate boilerplate and speed up module setup.</text><text x="52" y="285" font-size="13" fill="#7750a5" font-weight="600">Flutter · Dart · Firebase · Provider · Riverpod</text><rect x="28" y="328" width="904" height="202" rx="20" fill="#ffffff" stroke="#ebd58b"/><rect x="28" y="328" width="10" height="202" rx="5" fill="url(#pastel)" stroke="none"/><text x="52" y="359" font-size="11" fill="#7750a5" font-weight="700">SMART LOCKER ECOSYSTEM · TEAM OF 8</text><text x="52" y="394" font-size="28" fill="#302344" font-weight="700">Santa Pocket</text><text x="879" y="386" font-size="36" fill="#e8cc68" font-weight="700">02</text><text x="52" y="424" font-size="17" fill="#62556f" font-weight="400">Maintained a production ecosystem for Send, Receive, and Rent.</text><text x="52" y="447" font-size="17" fill="#62556f" font-weight="400">Built delegated pickup, live locker tracking, and modular mini-apps.</text><text x="52" y="470" font-size="17" fill="#62556f" font-weight="400">Integrated payment gateways, maps, deep links, and notifications.</text><text x="52" y="505" font-size="13" fill="#7750a5" font-weight="600">Flutter · Firebase · GetX · MobX · Google Maps · WebView</text><rect x="28" y="548" width="904" height="202" rx="20" fill="#ffffff" stroke="#ebd58b"/><rect x="28" y="548" width="10" height="202" rx="5" fill="url(#pastel)" stroke="none"/><text x="52" y="579" font-size="11" fill="#7750a5" font-weight="700">FOOD PRE-ORDERING · TEAM OF 8</text><text x="52" y="614" font-size="28" fill="#302344" font-weight="700">SantaFood</text><text x="879" y="606" font-size="36" fill="#e8cc68" font-weight="700">03</text><text x="52" y="644" font-size="17" fill="#62556f" font-weight="400">Built backend ordering within the Santa Pocket ecosystem:</text><text x="52" y="667" font-size="17" fill="#62556f" font-weight="400">restaurant discovery, cart, scheduling, and locker pickup selection.</text><text x="52" y="690" font-size="17" fill="#62556f" font-weight="400">Optimized deep-link navigation and WebView communication.</text><text x="52" y="725" font-size="13" fill="#7750a5" font-weight="600">Backend · Dart · Firebase · MobX · Google Maps</text></g></svg>
